<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الإلكتروني التفاعلي - المجموعة الثانية</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-color: #1e293b;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-background);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .progress-container {
            background-color: var(--border-color);
            border-radius: 8px;
            height: 8px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: var(--background-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .option-item.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #14532d;
            font-weight: 600;
        }

        .option-item.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #7f1d1d;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #1d4ed8;
        }

        .results-container {
            text-align: center;
            display: none;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .score-comment {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-header">
        <h1>الاختبار التفاعلي الشامل (المجموعة الثانية: 101 - 200)</h1>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div id="quiz-body">
        <div class="question-number" id="question-id">جاري التحميل...</div>
        <div class="question-text" id="question-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <button class="action-btn" id="next-btn">السؤال التالي</button>
    </div>

    <div class="results-container" id="results-container">
        <h2>اكتمل الاختبار!</h2>
        <p>لقد قمت بالإجابة على جميع الأسئلة للمجموعة الثانية بنجاح.</p>
        <div class="score-display" id="score-display">0 / 0</div>
        <div class="score-comment" id="score-comment"></div>
        <button class="action-btn" style="display: block;" onclick="location.reload()">إعادة الاختبار</button>
    </div>
</div>

    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionIdEl = document.getElementById("question-id");
    const questionTextEl = document.getElementById("question-text");
    const optionsListEl = document.getElementById("options-list");
    const nextBtn = document.getElementById("next-btn");
    const progressBar = document.getElementById("progress-bar");
    const quizBody = document.getElementById("quiz-body");
    const resultsContainer = document.getElementById("results-container");
    const scoreDisplay = document.getElementById("score-display");
    const scoreComment = document.getElementById("score-comment");

    function loadQuestion() {
        nextBtn.style.display = "none";
        const currentQuestion = questionsData[currentQuestionIndex];
        
        // تحديث مؤشر التقدم
        const progressPercentage = ((currentQuestionIndex) / questionsData.length) * 100;
        progressBar.style.width = `${progressPercentage}%`;

        questionIdEl.textContent = `السؤال ${currentQuestionIndex + 1} من ${questionsData.length} (رقم السؤال العام: ${currentQuestion.id})`;
        questionTextEl.textContent = currentQuestion.q;
        optionsListEl.innerHTML = "";

        currentQuestion.options.forEach((option, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.textContent = option;
            li.addEventListener("click", () => selectOption(index, li));
            optionsListEl.appendChild(li);
        });
    }

    function selectOption(selectedIndex, selectedLi) {
        const currentQuestion = questionsData[currentQuestionIndex];
        const allOptions = optionsListEl.children;

        if (selectedIndex === currentQuestion.correct) {
            selectedLi.classList.add("correct");
            score++;
        } else {
            selectedLi.classList.add("wrong");
            allOptions[currentQuestion.correct].classList.add("correct");
        }

        for (let li of allOptions) {
            li.classList.add("disabled");
        }

        nextBtn.style.display = "block";
    }

    nextBtn.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        progressBar.style.width = "100%";
        quizBody.style.display = "none";
        document.getElementById("quiz-header").style.display = "none";
        resultsContainer.style.display = "block";
        
        scoreDisplay.textContent = `${score} / ${questionsData.length}`;
        
        const percentage = (score / questionsData.length) * 100;
        if (percentage >= 85) {
            scoreComment.textContent = "أداء ممتاز! أنت ملم بالثقافة البصرية والمفاهيم التربوية تماماً. 🔥";
            scoreComment.style.color = "var(--success-color)";
        } else if (percentage >= 65) {
            scoreComment.textContent = "أداء جيد جداً، مراجعة بسيطة وستصل للعلامة الكاملة! 👍";
            scoreComment.style.color = "#d97706";
        } else {
            scoreComment.textContent = "تحتاج إلى مراجعة المفاهيم مرة أخرى، بالتوفيق في المحاولة القادمة! 📚";
            scoreComment.style.color = "var(--error-color)";
        }
    }

    // بدء تشغيل الاختبار
    loadQuestion();
